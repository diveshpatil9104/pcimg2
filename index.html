<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Loader</title>

    <style>
      #image-container img {
        width: 200px;
        height: auto;
        display: block;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div id="image-container"></div>

    <script>
      const container = document.getElementById("image-container");

      // 1. Fetch the JSON file generated by Python
      fetch("imagelist.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error(
              "Could not find imagelist.json. Did you run the Python script?"
            );
          }
          return response.json();
        })
        .then((data) => {
          // 2. Loop through the array of filenames
          data.forEach((filename) => {
            const img = document.createElement("img");
            img.src = "assets/" + filename;
            img.alt = filename; // Good practice for accessibility
            container.appendChild(img);
          });
        })
        .catch((error) => {
          console.error("Error:", error);
          container.innerText =
            "Error loading images. Check console for details.";
        });
    </script>
  </body>
</html>
